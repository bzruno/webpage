{{- define "main" }}
<main>
  <h1>Bem-vindo aos meus projetos</h1>

  <ul class="projetos">
    {{- range .Pages.ByDate.Reverse }}
    <li>
      <div class="projetos-header">
        <a href="{{ or .Params.link .RelPermalink }}"{{ with .Params.link }} target="_blank" rel="noopener"{{ end }}>{{ .Title }}</a>
        {{- with .Params.status }}
        <span class="projetos-status">[{{ . }}]</span>
        {{- end }}
      </div>
      {{- with .Description }}
      <p class="projetos-desc">{{ . }}</p>
      {{- end }}
    </li>
    {{- else }}
    <li>Nenhum projeto encontrado.</li>
    {{- end }}
  </ul>
</main>
{{- end }}
