baseURL = 'https://bruno.moe/'
languageCode = 'pt-br'
defaultContentLanguage = 'pt-br'
title = 'Minha página'
enableRobotsTXT = true

[params]
  description = 'Minha página'
  ogImage     = '/images/favicon.ico'

[params.author]
  name = 'Bruno'

[params.lifegrid]
  birthDate      = '1997-05-01'
  lifeExpectancy = 90

[permalinks]
  [permalinks.page]
    blog = '/blog/artigos/:slug'
  [permalinks.taxonomy]
    categorias = '/blog/categorias'
    series     = '/blog/series'
  [permalinks.term]
    categorias = '/blog/categorias/:slug'
    series     = '/blog/series/:slug'

[taxonomies]
  categoria = 'categorias'
  serie = 'series'

[markup.tableOfContents]
  startLevel = 2
  endLevel   = 4
  ordered    = true

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[security]
  enableInlineShortcodes = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[[menus.main]]
  name    = 'Home'
  pageRef = '/'
  weight  = 10

[[menus.main]]
  name    = 'Blog'
  pageRef = '/blog'
  weight  = 20

[[menus.main]]
  name    = 'Projetos'
  pageRef = '/projetos'
  weight  = 30

[[menus.main]]
  name    = 'Categorias'
  url     = '/blog/categorias/'
  weight  = 40

[[menus.main]]
  name    = 'Séries'
  url     = '/blog/series/'
  weight  = 50

