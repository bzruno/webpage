baseURL = 'https://bruno.moe/'
defaultContentLanguage = 'pt-br'
locale = 'pt-BR'
title = 'Minha página'
enableRobotsTXT = true

# Fixa o fuso do build: sem isso as datas dependem do TZ da máquina, e o site
# renderiza diferente na sua máquina e no CI (que exporta TZ no workflow).
timeZone = 'America/Sao_Paulo'

# Falha cedo, com mensagem clara, se o site for compilado com um Hugo mais
# antigo que o do CI (.github/workflows/main.yml) — sem isto o erro seria uma
# função "inexistente" no meio de um template.
[module.hugoVersion]
  min = '0.169.0'

[params]
  description = 'Minha página'
  # Caminho relativo a assets/ — processado pelo pipeline de imagens.
  # Um .ico não é aceito como og:image por nenhuma rede social.
  ogImage     = 'images/og-base.png'

[params.author]
  name = 'Bruno'

[params.lifegrid]
  birthDate      = '1997-05-01'
  lifeExpectancy = 90

[permalinks]
  [permalinks.page]
    blog = '/blog/artigos/:slug'
  [permalinks.taxonomy]
    categorias = '/blog/categorias'
    series     = '/blog/series'
  [permalinks.term]
    categorias = '/blog/categorias/:slug'
    series     = '/blog/series/:slug'

[taxonomies]
  categoria = 'categorias'
  serie = 'series'

[markup.tableOfContents]
  startLevel = 2
  endLevel   = 4
  ordered    = true

# Realce de sintaxe por classes CSS em vez de style="" inline em cada token.
# Com noClasses = true (o padrão) o Chroma escreve as cores direto no HTML:
# a página engorda, o cache não ajuda em nada e a folha gerada por
# css.ChromaStyles não teria efeito algum. Com false, o HTML sai só com
# classes e as cores vêm da folha de estilo — que o baseof.html gera em
# tempo de build e concatena no bundle CSS, sem requisição extra.
#
# O estilo tokyonight-night usa a mesma paleta dos marcos do lifegrid
# (#7aa2f7, #9ece6a, #f7768e, #e0af68), então o bloco de código combina
# com o resto do site em vez de destoar.
[markup.highlight]
  noClasses = false
  style     = 'tokyonight-night'
  tabWidth  = 2

# Conteúdo relacionado: o Hugo indexa os artigos por estes parâmetros e o
# single.html consulta esse índice. Sem o bloco [related] o Hugo usa um
# padrão que só considera keywords + date — parâmetros que este site não
# usa, o que devolveria uma lista sempre vazia.
[related]
  includeNewer = true
  threshold    = 60
  toLower      = true

  [[related.indices]]
    name   = 'categorias'
    weight = 100

  [[related.indices]]
    name   = 'series'
    weight = 80

  [[related.indices]]
    name   = 'date'
    weight = 10

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Render hook embutido de links: resolve links markdown para páginas/recursos
# e avisa no build quando o destino interno não existe.
#
# A chave antiga enableDefault foi removida no Hugo 0.148; hoje o ajuste é
# useEmbedded, com 'never' | 'auto' | 'fallback' | 'always'. O padrão 'auto'
# só liga o hook em sites multilíngues — ou seja, aqui ele ficaria desligado.
# 'fallback' liga o hook embutido justamente por não existir hook próprio de
# link neste projeto (o de imagem, esse sim, está em layouts/_markup/).
[markup.goldmark.renderHooks.link]
  useEmbedded = 'fallback'

# Passthrough: entrega as fórmulas ao KaTeX sem o Goldmark interpretá-las.
# Sem isso o Goldmark consome as barras invertidas e "\(x\)" chega ao navegador
# como "(x)" — o KaTeX nunca acha o delimitador e a fórmula não renderiza.
# Trechos como *a* ou _b_ dentro da fórmula também virariam itálico.
# Delimitadores conforme a documentação do Hugo — "$" simples fica de fora
# de propósito, para não quebrar valores monetários (R$ 10).
[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block  = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)']]

[[menus.main]]
  name    = 'Home'
  pageRef = '/'
  weight  = 10

[[menus.main]]
