name: Deploy Hugo

on:
  push:
    branches: [main]
  # Permite disparar o build à mão pela aba Actions, útil para republicar sem
  # precisar de um commit vazio.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: '0.169.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # --panicOnWarning transforma qualquer aviso do Hugo em erro de build.
      # Sem isso, um recurso de imagem que sumiu ou uma função marcada como
      # obsoleta numa atualização futura apenas imprimiria um aviso no log —
      # que ninguém lê quando o job termina em verde — e o site iria ao ar
      # quebrado. Com a flag, a atualização que introduzir a regressão falha
      # aqui, antes de publicar.
      - name: Build
        run: hugo --minify --gc --panicOnWarning
        env:
          # O timeZone do hugo.toml vale para as datas do conteúdo, mas não para
          # a função now, que usa o relógio da máquina: sem isto o "Última
          # atualização" do lifegrid sairia em UTC.
          TZ: America/Sao_Paulo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
